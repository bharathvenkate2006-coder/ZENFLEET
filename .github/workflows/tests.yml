name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python -m pip install -e "cnp[dev]"
      - run: python -m pytest -q
        working-directory: cnp
      - run: python -m bidding.demo_scenarios --config config_zenfleet.json --scenario all --compare
        working-directory: cnp
      - run: python -m traffic.run run --sizes 10 --seeds 1 --out /tmp/zf_ci --label ci
